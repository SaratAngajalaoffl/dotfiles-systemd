[Service]
# Two GPUs (RTX 4070 + Ryzen iGPU): make whisper.cpp use the NVIDIA card.
Environment=VOXTYPE_VULKAN_DEVICE=nvidia
# Run the Vulkan build directly. The package's /usr/bin/voxtype symlink is
# reset to the CPU-only voxtype-native on every upgrade, which silently drops
# transcription back to CPU (`voxtype setup gpu --enable` doesn't survive it).
ExecStart=
ExecStart=/usr/lib/voxtype/voxtype-vulkan -q daemon
