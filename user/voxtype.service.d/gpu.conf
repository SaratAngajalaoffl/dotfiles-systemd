[Service]
# Two GPUs (RTX 4070 + Ryzen iGPU): pin GPU work to the NVIDIA card.
Environment=VOXTYPE_VULKAN_DEVICE=nvidia
# Run the ONNX CUDA 13 build (Parakeet) directly rather than via /usr/bin/voxtype,
# whose target the package's install hook may reset on upgrade. Requires
# voxtype-bin + cuda + cudnn. For Whisper, use /usr/lib/voxtype/voxtype-vulkan.
ExecStart=
ExecStart=/usr/lib/voxtype/voxtype-onnx-cuda-13 -q daemon
